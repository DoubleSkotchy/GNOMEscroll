[package]
name = "gnomescroll"
version = "0.1.0"
edition = "2021"
authors = ["Kalpit"]
description = "High-performance scrolling screenshot utility for GNOME Wayland"
license = "MIT"

[lib]
name = "gnomescroll"
path = "src/lib.rs"

[[bin]]
name = "gnomescroll"
path = "src/main.rs"

[dependencies]
zbus = { version = "5.5", features = ["blocking-api", "async-io"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
dirs = "6.0"
libc = "0.2"
